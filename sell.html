<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Your Work — PhotArt</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0d0d0d;
  color: white;
}

header {
  padding: 20px 7%;
  border-bottom: 1px solid #292929;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #ffb000;
}

.container {
  max-width: 600px;
  margin: 50px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 35px;
}

.form-box {
  background: #181818;
  padding: 25px;
  border-radius: 15px;
  border: 1px solid #292929;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #0d0d0d;
  color: white;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #ffb000;
  color: #111;
  font-weight: bold;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Phot<span>Art</span></div>
</header>

<div class="container">

  <h1>Sell Your Work</h1>

  <p class="subtitle">
    Share your photography or artwork with the PhotArt community.
  </p>

  <div class="form-box">

    <label>Artwork Title</label>
    <input type="text" placeholder="Enter artwork title">

    <label>Description</label>
    <textarea placeholder="Describe your artwork"></textarea>

    <label>Artwork Type</label>
    <select>
      <option>Photography</option>
      <option>Drawing</option>
      <option>Art Print</option>
    </select>

    <label>Price (₹)</label>
    <input type="number" placeholder="Enter your price">

    <label>Upload Artwork</label>
    <input type="file" accept="image/*">

    <button class="button">Submit Artwork</button>

  </div>

</div>

</body>
</html>
