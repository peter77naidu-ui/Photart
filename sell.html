<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Your Work - PhotArt</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #1c1c1c;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Sell Your Work</h1>
    <p>Upload your artwork and list it on PhotArt.</p>

    <form id="artworkForm">

      <label>Artwork Title</label>
      <input type="text" id="title" required>

      <label>Description</label>
      <textarea id="description" required></textarea>

      <label>Artwork Type</label>
      <select id="artworkType" required>
        <option value="">Select type</option>
        <option value="Photography">Photography</option>
        <option value="Drawing">Drawing</option>
        <option value="Art Print">Art Print</option>
      </select>

      <label>Price (₹)</label>
      <input type="number" id="price" min="0" step="0.01" required>

      <label>Upload Artwork</label>
      <input type="file" id="artworkFile" accept="image/*" required>

      <button type="submit" id="submitButton">
        Submit Artwork
      </button>

      <div id="message"></div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://rlzepraqcsjfdvnxhyoh.supabase.co";

    const SUPABASE_KEY = sb_publishable_XYx_6fzJ655rMPR1liOZMA_08iS0u_N

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("artworkForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Submitting...";
      message.textContent = "";

      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      const artworkType = document.getElementById("artworkType").value;
      const price = document.getElementById("price").value;
      const file = document.getElementById("artworkFile").files[0];

      try {

        const fileName =
          Date.now() + "-" +
          file.name.replace(/[^a-zA-Z0-9.-]/g, "-");

        const { error: uploadError } =
          await db.storage
            .from("artwork")
            .upload(fileName, file);

        if (uploadError) {
          throw uploadError;
        }

        const { error: databaseError } =
          await db
            .from("artworks")
            .insert({
              title: title,
              description: description,
              artwork_type: artworkType,
              price: price,
              image_path: fileName
            });

        if (databaseError) {
          throw databaseError;
        }

        message.textContent =
          "Artwork submitted successfully! 🎨";

        form.reset();

      } catch (error) {

        console.error(error);

        message.textContent =
          "Something went wrong: " + error.message;

      }

      button.disabled = false;
      button.textContent = "Submit Artwork";
    });
  </script>

</body>
</html>
