<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Artwork - PhotArt</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    #artworkGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 18px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .type {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .description {
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Explore PhotArt</h1>
    <p class="subtitle">Discover photography, drawings and original artwork.</p>

    <div id="artworkGrid"></div>

    <div id="message">Loading artwork...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://rlzepraqcsjfdvnxhyoh.supabase.co";

    const SUPABASE_KEY ="sb_publishable_XYx_6fzJ655rMPR1liOZMA_08iS0u_N";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadArtwork() {

      const grid = document.getElementById("artworkGrid");
      const message = document.getElementById("message");

      const { data, error } = await db
        .from("artworks")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        message.textContent = "Could not load artwork: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "No artwork has been submitted yet.";
        return;
      }

      message.textContent = "";

      data.forEach(artwork => {

        const { data: imageData } =
          db.storage
            .from("artwork")
            .getPublicUrl(artwork.image_path);

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${imageData.publicUrl}" alt="${artwork.title}">
          <div class="card-content">
            <h2>${artwork.title}</h2>
            <div class="type">${artwork.artwork_type}</div>
            <div class="description">${artwork.description || ""}</div>
            <div class="price">₹${artwork.price}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    loadArtwork();
  </script>

</body>
</html>
